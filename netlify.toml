[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# La app es una SPA: cualquier ruta que no sea un archivo real debe servir
# index.html. Netlify resuelve las funciones en /.netlify/functions/* antes
# de aplicar este catch-all, así que no interfiere con ellas.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
